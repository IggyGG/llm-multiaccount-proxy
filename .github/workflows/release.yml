name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify the tag matches the packaged binary version
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  release-draft:
    needs: quality
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the draft before parallel artifact uploads
        env:
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          args=(--verify-tag --draft --title "${GITHUB_REF_NAME}" --generate-notes)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; reusing it"
          else
            gh release create "${GITHUB_REF_NAME}" "${args[@]}"
          fi

  binaries:
    needs: release-draft
    env:
      LLMAP_BUILD_SHA: ${{ github.sha }}
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ${{ contains(matrix.target, 'apple') && 'macos-latest' || contains(matrix.target, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1.30.2
        with:
          bin: llmap
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256

  container:
    needs: release-draft
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/iggygg/llm-multiaccount-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Execute published images on both architectures
        env:
          IMAGE: ghcr.io/iggygg/llm-multiaccount-proxy
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 "${IMAGE}@${DIGEST}" --version
          docker run --rm --platform linux/arm64 "${IMAGE}@${DIGEST}" --version
      - uses: sigstore/cosign-installer@v4.1.2
      - env:
          IMAGE: ghcr.io/iggygg/llm-multiaccount-proxy
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: anchore/sbom-action@v0.24.2
        with:
          image: ghcr.io/iggygg/llm-multiaccount-proxy@${{ steps.build.outputs.digest }}
          artifact-name: llmap-container.spdx.json
          output-file: llmap-container.spdx.json
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: llmap-container.spdx.json

  publish-release:
    needs: [binaries, container]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish only after every binary and the signed image succeed
        env:
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          args=(--draft=false)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release edit "${GITHUB_REF_NAME}" "${args[@]}"
